# Rotary encoders
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Uncomment the following line to enable the OLED Display
CONFIG_ZMK_DISPLAY=y
# CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y
#CONFIG_ZMK_STUDIO=y
# CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# CONFIG_BT=y

# CONFIG_ZMK_SPLIT=y

# --- Native Apple Fn/Globe key (requires the patched ZMK fork, see config/west.yml) ---
CONFIG_ZMK_HID_APPLE_FN=y
# macOS only honours the Fn bit for Apple VID/PID (Apple Keyboard ANSI)
CONFIG_USB_DEVICE_VID=0x05AC
CONFIG_USB_DEVICE_PID=0x024F
CONFIG_BT_DIS_PNP_VID=0x05AC
CONFIG_BT_DIS_PNP_PID=0x024F
# fn + F1..F12 work reliably only with NKRO
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y
